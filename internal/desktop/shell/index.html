<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Keel</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0d0d0d;
      color: #8a8a8a;
      font-family: ui-sans-serif, system-ui, sans-serif;
      display: grid;
      place-items: center;
    }
    .splash {
      display: grid;
      justify-items: center;
      gap: 14px;
    }
    .splash svg { display: block; border-radius: 11px; }
    .splash p { margin: 0; font-size: 13px; }
  </style>
</head>
<body>
  <div class="splash">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48" aria-hidden="true">
      <rect width="32" height="32" fill="#141414"/>
      <path d="M7 22 L16 8 L25 22" fill="none" stroke="#ececec" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p>Starting Keel…</p>
  </div>
</body>
</html>
