<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Keel</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0d0d0d;
      color: #8a8a8a;
      font-family: ui-sans-serif, system-ui, sans-serif;
      display: grid;
      place-items: center;
    }
    .splash {
      display: grid;
      justify-items: center;
      gap: 14px;
    }
    .splash svg { display: block; }
    .splash p { margin: 0; font-size: 13px; }
  </style>
</head>
<body>
  <div class="splash">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="56" height="56" aria-hidden="true">
      <rect width="32" height="32" fill="#141414"/>
      <path d="M4 25 L16 5 L28 25" fill="none" stroke="#ececec" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>
    </svg>
    <p>Starting Keel…</p>
  </div>
</body>
</html>
