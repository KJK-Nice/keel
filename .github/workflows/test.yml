name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # macOS runs every package. Linux runs every package except the window (keel/internal/native itself; its
      # sub-packages keelclient, joinpeer, layout and sshparse still run): the window's tests were written and run only
      # on macOS, and on Linux seven fail and one panics, which aborts the rest of the package. Follow-up: find the
      # Linux causes (docs/native.md "Linux"), fix them, then run make test on both legs again.
      - name: make test
        if: runner.os == 'macOS'
        run: sh scripts/ci-run.sh "make test (${{ matrix.os }})" make test

      - name: make test-nonwindow (the window's tests are not green on Linux yet)
        if: runner.os == 'Linux'
        run: sh scripts/ci-run.sh "make test-nonwindow (${{ matrix.os }})" make test-nonwindow

      # Issue #140, round 1 (docs/native.md "Linux"): run the window's package with -v on Ubuntu, never failing the job, print what
      # a layout difference could come from, and keep the whole log. Remove this step once the package is green here and the
      # Linux leg runs make test.
      - name: window tests on Linux (diagnostic, #140)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          echo "== facts"
          go env GOOS GOARCH
          echo "DISPLAY=$DISPLAY WAYLAND_DISPLAY=$WAYLAND_DISPLAY XDG_SESSION_TYPE=$XDG_SESSION_TYPE"
          locale || true
          echo "gtk-3 libraries: $(ldconfig -p | grep -c gtk-3 || true)"
          echo "pango/cairo/fontconfig/freetype libraries:"
          ldconfig -p | grep -E 'libpango|libcairo|libfontconfig|libfreetype|libharfbuzz' || echo "none"
          if command -v fc-list >/dev/null 2>&1; then
            echo "fonts: $(fc-list | wc -l)"
            fc-match sans
            fc-match monospace
            fc-match system-ui
          else
            echo "no fc-list"
          fi
          echo "== go test -v ./internal/native/"
          KEEL_KEYRING=off KEEL_AGENT_PROVIDER=fake go test -count=1 -v ./internal/native/ 2>&1 | tee window-linux.log || true
          echo "== summary"
          grep -E '^(--- FAIL|FAIL|ok|panic)' window-linux.log || true
          echo "== linux-diag lines"
          grep 'linux-diag' window-linux.log || true
          exit 0

      - name: Upload the window test log (diagnostic, #140)
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: window-linux-log
          path: window-linux.log
          if-no-files-found: ignore
          retention-days: 14

  # The native window (keel app) under MyGo's ui.Tester against a scratch keel serve, as make native-e2e runs it.
  # Nobody has seen a headless macOS runner run it (it needs the window server), so a failure does not fail the
  # workflow yet: make it required once it has passed here. The unit tests of internal/native run in make test above.
  native-e2e:
    name: native e2e (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make native-e2e
        run: sh scripts/ci-run.sh "native e2e" make native-e2e

      - name: Upload the screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e
          path: .scratch-native/e2e/
          if-no-files-found: ignore
          retention-days: 7

  # The built app driven from outside through MyGo's automation socket (plan 029; a test build, scratch data).
  # A headless runner may not have a window server, so a failure does not fail the workflow.
  native-automation:
    name: native automation (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make native-automation
        run: sh scripts/ci-run.sh "native automation" make native-automation

      - name: Upload the screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-automation
          path: .scratch-native/automation/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, vet, staticcheck, vulncheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make ${{ matrix.check }}
        run: sh scripts/ci-run.sh "${{ matrix.check }}" make ${{ matrix.check }}

  signal-image:
    name: signal image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: docker build (keel-signal, as Railway builds it)
        run: sh scripts/ci-run.sh "signal image" docker build -t keel-signal:ci .

      - name: go.mod and Dockerfile agree on the Go version
        run: |
          want=$(awk '/^go /{print $2}' go.mod)
          grep -q "^FROM golang:${want}-alpine" Dockerfile || { echo "::error::Dockerfile Go image does not match go.mod (go ${want})"; exit 1; }
