name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 and WebKitGTK 6 (Wails v3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: make test
        run: sh scripts/ci-run.sh "make test (${{ matrix.os }})" make test

  generated:
    name: generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make check-generated
        run: sh scripts/ci-run.sh "generated files" make check-generated

  lint:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, vet, staticcheck, vulncheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 and WebKitGTK 6 (Wails v3)
        if: matrix.check != 'fmt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make ${{ matrix.check }}
        run: sh scripts/ci-run.sh "${{ matrix.check }}" make ${{ matrix.check }}
